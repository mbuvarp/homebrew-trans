name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"
          else
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Push commits
        uses: Homebrew/actions/git-try-push@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          branch: main

      - name: Delete published update branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail

          metadata="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}" \
              --jq '[.state, .merged, .head.repo.full_name, .head.ref, .head.sha] | @tsv'
          )"
          IFS=$'\t' read -r state merged head_repository head_ref head_sha <<<"$metadata"

          if [[ "$state" != "closed" || "$merged" != "false" ]]; then
            echo "Refusing to delete a branch for a PR that was not closed unmerged." >&2
            exit 1
          fi
          if [[ "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "Refusing to delete a branch from another repository: $head_repository" >&2
            exit 1
          fi
          if [[ ! "$head_ref" =~ ^update-trans-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to delete an unexpected branch: $head_ref" >&2
            exit 1
          fi
          if [[ -n "$HEAD_SHA" && "$head_sha" != "$HEAD_SHA" ]]; then
            echo "Refusing to delete a branch whose head SHA changed." >&2
            exit 1
          fi

          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${head_ref}"
